<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style login.css" />
</head>

<body>

    <nav class="menu">
        <a href="index.html" class="link">Home</a>
        <a href="galeria.html" class="link">Galeria</a>
        <a href="chat.html" class="link">Chat</a>
        <a href="cadastro.html" class="link">Cadastro</a>
        <a href="login.html" class="link">Login</a>
    </nav>

    <main>

        <div class="container">

            <div class="omnitrix-icon">
                <div class="omnitrix-inner"></div>
            </div>

            <h2>Login</h2>
            <div class="linha"></div>

            <div class="campo-grupo">
                <label for="loginEmail">E-MAIL</label>
                <input type="email" id="loginEmail" placeholder="Digite seu e-mail">
            </div>

            <div class="campo-grupo">
                <label for="loginSenha">SENHA</label>
                <input type="password" id="loginSenha" placeholder="Digite sua senha">
            </div>

            <button id="btnLogin">Enviar</button>
            <div id="loginMensagem" class="mensagem"></div>

        </div>

    </main>

    <footer> © Desenvolvido por Lucca Scholz </footer>

    <script>

        const btnLogin = document.querySelector('#btnLogin')
        const btnMensagem = document.querySelector('#loginMensagem')

        btnLogin.addEventListener('click', async () => {
            const emailEntrada = document.querySelector('#loginEmail');
            const senhaEntrada = document.querySelector('#loginSenha');

            const emailDigitado = emailEntrada.value;
            const senhaDigitada = senhaEntrada.value

            if (!emailDigitado || !senhaDigitada) {
                loginMensagem.innerText = 'Preencha todos os campos antes de enviar!';
                loginMensagem.style.color = 'red';
                return;
            }

            try {
                const respostaBe = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: emailDigitado,
                        senha: senhaDigitada
                    })
                });

                const dados = await respostaBe.json();

                if (!respostaBe.ok) {
                    loginMensagem.innerText = `${dados.erro}`;
                    loginMensagem.style.color = 'red';
                    return;
                }

                loginMensagem.innerText = `${dados.mensagem}: ${dados.usuario} entrando no chat...`;
                loginMensagem.style.color = 'green';

                emailEntrada.value = '';
                senhaEntrada.value = '';

                // guarda o nome para o chat e leva o usuário até lá
                sessionStorage.setItem('usuarioLogado', dados.usuario);
                setTimeout(() => {
                    window.location.href = 'chat.html';
                }, 1500);

            } catch (erro) {
                console.error('Erro na requisição:', erro);
                loginMensagem.innerText = 'Erro ao conectar com o servidor!!';
                loginMensagem.style.color = 'red';
            }
        })


    </script>
</body>

</html>
