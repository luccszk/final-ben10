
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omnitrix Chat</title>
    <link rel="stylesheet" href="style chat.css">
</head>

<body>

    <nav class="menu">
        <a class="link" href="index.html">Início</a>
        <a class="link" href="galeria.html">Galeria</a>
        <a class="link" href="chat.html">Chat</a>
        <a class="link" href="cadastro.html">Cadastro</a>
        <a class="link" href="login.html">Login</a>
    </nav>

    <main class="chatContainer">
        <h1>OMNITRIX CHAT</h1>

        <div id="boasVindas"></div>

        <div id="caixaChat"></div>

        <div id="inputArea">
            <input
                type="text"
                id="mensagem"
                placeholder="Fale com o Omnitrix..."
                autocomplete="off"
            >
            <button id="btnEnviar">Enviar</button>
        </div>
    </main>

    <footer>© Desenvolvido por Lucca Scholz</footer>

    <script>
        const usuarioLogado = sessionStorage.getItem('usuarioLogado')

        if (!usuarioLogado) {
            window.location.href = 'login.html'
        }

        const boasVindas = document.querySelector('#boasVindas')
        const caixaChat = document.querySelector('#caixaChat')
        const mensagem = document.querySelector('#mensagem')
        const btnEnviar = document.querySelector('#btnEnviar')

        let historicoConversa = []

        boasVindas.innerText = `Bem-vindo, ${usuarioLogado}! Converse com o Omnitrix.`

        function adicionarMensagem(remetente, texto) {
            const div = document.createElement('div')
            div.classList.add('mensagem-chat')
            div.classList.add(remetente === 'Você' ? 'mensagem-usuario' : 'mensagem-omnitrix')

            const nome = document.createElement('strong')
            nome.innerText = remetente

            const conteudo = document.createElement('p')
            conteudo.innerText = texto

            div.appendChild(nome)
            div.appendChild(conteudo)
            caixaChat.appendChild(div)

            caixaChat.scrollTop = caixaChat.scrollHeight
        }

        async function enviarMensagem() {
            const texto = mensagem.value.trim()

            if (!texto) return

            mensagem.value = ''
            adicionarMensagem('Você', texto)

            historicoConversa.push({
                role: 'user',
                content: texto
            })

            btnEnviar.disabled = true

            try {
                const resposta = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        historico: historicoConversa,
                        usuario: usuarioLogado
                    })
                })

                const dados = await resposta.json()

                if (!resposta.ok) {
                    throw new Error(dados.erro || 'Erro ao conversar com o Omnitrix')
                }

                adicionarMensagem('Omnitrix', dados.resposta)

                historicoConversa.push({
                    role: 'assistant',
                    content: dados.resposta
                })

            } catch (erro) {
                console.error(erro)
                adicionarMensagem('Omnitrix', erro.message)
            }

            btnEnviar.disabled = false
            mensagem.focus()
        }

        btnEnviar.addEventListener('click', enviarMensagem)

        mensagem.addEventListener('keydown', (evento) => {
            if (evento.key === 'Enter') {
                enviarMensagem()
            }
        })
    </script>

</body>
</html>
